spring:
  application:
    name: sala-de-situacao

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/sala_saude}
    username: ${SPRING_DATASOURCE_USERNAME:appuser}
    password: ${SPRING_DATASOURCE_PASSWORD:}

  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
    open-in-view: false

  flyway:
    enabled: true

analytics:
  datasource:
    url: ${ANALYTICS_DATASOURCE_URL:jdbc:postgresql://localhost:5432/situacao_saude}
    username: ${ANALYTICS_DATASOURCE_USERNAME:nss}
    password: ${ANALYTICS_DATASOURCE_PASSWORD:}
    hikari:
      read-only: true
      connection-timeout: ${ANALYTICS_DATASOURCE_CONNECTION_TIMEOUT:5000}
  schema:
    year-column: ${ANALYTICS_YEAR_COLUMN:year}
    month-column: ${ANALYTICS_MONTH_COLUMN:month}

api:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  auth:
    refresh-cookie-name: ${REFRESH_COOKIE_NAME:nss_refresh}
    refresh-expiration: ${REFRESH_EXPIRATION:604800000}
    secure-cookie: ${SECURE_COOKIES:false}

jwt:
  secret: ${JWT_SECRET:ZmFrZS1kZXZlbG9wbWVudC1zZWNyZXQtdGhhdC1pcy1sb25nLWVub3VnaC0zMg==}
  expiration: ${JWT_EXPIRATION:3600000}
