name: Java verification

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Run tests and quality gates
        run: ./mvnw -B verify

  mutation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Run mutation testing quality gate
        run: |
          ./mvnw -B test-compile org.pitest:pitest-maven:mutationCoverage
          ./mvnw -B test-compile org.pitest:pitest-maven:mutationCoverage \
            '-DtargetClasses=com.example.nss.analytics.application.*,com.example.nss.analytics.domain.*' \
            '-DtargetTests=com.example.nss.analytics.*' \
            '-DreportDirectory=target/pit-reports/analytics'
          ./mvnw -B test-compile org.pitest:pitest-maven:mutationCoverage \
            '-DtargetClasses=com.example.nss.user.application.*,com.example.nss.user.domain.*' \
            '-DtargetTests=com.example.nss.user.*' \
            '-DreportDirectory=target/pit-reports/user'

  container:
    runs-on: ubuntu-24.04
    needs: verify
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - name: Build production container
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: nss:ci-${{ github.sha }}
      - name: Verify image metadata
        run: docker image inspect nss:ci-${{ github.sha }}
